<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESOP Plans in the United States</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      padding: 12px 20px 10px;
      background: white;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 9px;
      letter-spacing: 0.01em;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    #year-label {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111;
      min-width: 54px;
      line-height: 1;
    }

    #year-slider {
      flex: 1;
      min-width: 160px;
      max-width: 460px;
      accent-color: #555;
      cursor: pointer;
      height: 4px;
    }

    #stats {
      font-size: 0.78rem;
      color: #666;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stat-item { white-space: nowrap; }
    .stat-item strong { color: #111; font-weight: 600; }

    /* --- Company search --- */
    #search-wrap {
      position: relative;
      min-width: 200px;
    }

    #search-input {
      width: 220px;
      max-width: 100%;
      padding: 6px 26px 6px 10px;
      font-size: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }

    #search-input:focus {
      outline: none;
      border-color: #888;
    }

    #search-clear {
      display: none;
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1rem;
      line-height: 1;
      color: #999;
      cursor: pointer;
      padding: 2px 4px;
    }

    #search-clear:hover { color: #333; }
    #search-clear.visible { display: block; }

    #search-results {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 340px;
      max-width: 90vw;
      max-height: 320px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      z-index: 2000;
    }

    #search-results.open { display: block; }

    .search-result {
      padding: 7px 10px;
      font-size: 0.78rem;
      line-height: 1.35;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-result:last-child { border-bottom: none; }
    .search-result:hover,
    .search-result.active { background: #f2f2f2; }

    .search-result .r-name {
      color: #222;
      font-weight: 600;
      display: block;
    }

    .search-result .r-meta {
      color: #888;
      font-size: 0.72rem;
    }

    .search-result.no-loc {
      cursor: default;
    }

    .search-result.no-loc:hover { background: none; }

    .search-result.no-loc .r-name { color: #999; }

    .search-result.no-loc .r-meta {
      font-style: italic;
    }

    .search-empty {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: #999;
    }

    #loading {
      font-size: 0.78rem;
      color: #888;
      display: none;
    }

    #map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; }

    /* Mute the basemap so category markers stay legible */
    #map .leaflet-tile-pane {
      filter: grayscale(1) brightness(1.08) contrast(0.92);
    }

    /* --- Floating legend panel --- */
    #legend {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 14px 12px;
      font-size: 0.76rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.13);
      max-height: calc(100% - 24px);
      overflow-y: auto;
      min-width: 230px;
    }

    #legend-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.8rem;
      color: #333;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
    }

    #legend-close {
      background: none;
      border: none;
      font-size: 1rem;
      line-height: 1;
      color: #999;
      cursor: pointer;
      padding: 0 0 0 8px;
    }

    #legend-close:hover { color: #333; }

    #legend.closed { display: none; }

    #legend-reopen {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.76rem;
      color: #444;
      box-shadow: 0 2px 8px rgba(0,0,0,0.13);
      cursor: pointer;
    }

    #legend-reopen:hover { background: #f5f5f5; }
    #legend-reopen.visible { display: block; }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 0;
      cursor: pointer;
      user-select: none;
    }

    .legend-row input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,0.15);
    }

    .legend-name {
      flex: 1;
      color: #333;
      line-height: 1.3;
    }

    .legend-count {
      color: #888;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: right;
    }

    .legend-row.dimmed .legend-name,
    .legend-row.dimmed .legend-count {
      color: #bbb;
    }

    /* --- Click hint --- */
    #map-hint {
      position: absolute;
      bottom: 28px;
      left: 12px;
      z-index: 1000;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 0.72rem;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      pointer-events: none;
    }

    /* --- Legend footer --- */
    #legend-footer {
      margin-top: 10px;
      padding-top: 7px;
      border-top: 1px solid #eee;
      font-size: 0.72rem;
      color: #999;
      text-align: center;
    }
    #legend-footer a {
      color: #888;
      text-decoration: none;
    }
    #legend-footer a:hover { text-decoration: underline; }

    /* --- Form 5500 CTA button --- */
    #form5500-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 7px 10px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.72rem;
      color: #444;
      text-align: center;
      cursor: pointer;
      line-height: 1.35;
      font-family: inherit;
      transition: background 0.15s;
    }
    #form5500-btn:hover { background: #efefef; color: #222; }

    /* --- PDF modal overlay --- */
    #pdf-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
    }
    #pdf-modal.open { display: flex; }
    #pdf-modal-box {
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.28);
      width: min(860px, 92vw);
      height: min(88vh, 700px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #pdf-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    #pdf-modal-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #333;
    }
    #pdf-modal-actions { display: flex; align-items: center; gap: 12px; }
    #pdf-modal-newtab {
      font-size: 0.72rem;
      color: #666;
      text-decoration: none;
    }
    #pdf-modal-newtab:hover { text-decoration: underline; }
    #pdf-modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #999;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
    }
    #pdf-modal-close:hover { color: #333; }
    #pdf-modal-frame { flex: 1; width: 100%; border: none; }

    /* Compact popups */
    .leaflet-popup-content {
      margin: 8px 12px;
      font-size: 0.82rem;
      line-height: 1.6;
      max-width: 260px;
    }
    .leaflet-popup-content b {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 1px;
    }
    .leaflet-popup-content .popup-meta {
      color: #666;
      font-size: 0.78rem;
    }
    .leaflet-popup-content b a {
      color: #1a5cc8;
      text-decoration: none;
    }
    .leaflet-popup-content b a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>ESOP Plans in the United States &mdash; Form 5500 filings</h1>
    <div id="controls">
      <span id="year-label">2024</span>
      <input type="range" id="year-slider" min="2000" max="2024" value="2024" step="1">
      <div id="search-wrap">
        <input type="text" id="search-input" placeholder="Search ESOP by company name&hellip;" autocomplete="off">
        <button id="search-clear" aria-label="Clear search and reset map">&times;</button>
        <div id="search-results"></div>
      </div>
      <div id="stats">
        <span class="stat-item">Shown on map: <strong id="stat-visible">&mdash;</strong></span>
        <span class="stat-item">No location data: <strong id="stat-na">&mdash;</strong></span>
        <span class="stat-item">Total ESOPs that year: <strong id="stat-total">&mdash;</strong></span>
      </div>
      <span id="loading">Loading&hellip;</span>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>

    <div id="legend">
      <div id="legend-title">
        <span>Industries</span>
        <button id="legend-close" aria-label="Close industries panel">&times;</button>
      </div>
      <div id="legend-items"></div>
      <button id="form5500-btn">Click here for an example of a Form 5500 filing</button>
      <div id="legend-footer">
        <a href="https://lydiagcamp.github.io" target="_blank" rel="noopener">lydiagcamp.github.io</a>
      </div>
    </div>

    <button id="legend-reopen">Show industries</button>

    <div id="map-hint">Click any dot for plan details</div>

    <div id="pdf-modal" role="dialog" aria-modal="true" aria-label="Form 5500 example">
      <div id="pdf-modal-box">
        <div id="pdf-modal-header">
          <span id="pdf-modal-title">Example Form 5500 Filing</span>
          <div id="pdf-modal-actions">
            <a id="pdf-modal-newtab" href="#" target="_blank" rel="noopener">Open in new tab ↗</a>
            <button id="pdf-modal-close" aria-label="Close">&times;</button>
          </div>
        </div>
        <iframe id="pdf-modal-frame" title="Form 5500 example"></iframe>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- Industry groups: order matters (Other always last) ---
    const GROUP_ORDER = [
      'Manufacturing',
      'Professional & Technical Services',
      'Finance & Insurance',
      'Wholesale & Retail',
      'Construction',
      'Business Services',
      'Health, Education & Arts',
      'Transportation & Utilities',
      'Other'
    ];

    // Tableau 10 palette — muted, professional, distinct
    const GROUP_COLORS = {
      'Manufacturing':                    '#4E79A7',
      'Professional & Technical Services':'#59A14F',
      'Finance & Insurance':              '#E15759',
      'Wholesale & Retail':               '#F28E2B',
      'Construction':                     '#B07AA1',
      'Business Services':                '#76B7B2',
      'Health, Education & Arts':         '#FF9DA7',
      'Transportation & Utilities':       '#9C755F',
      'Other':                            '#BAB0AC'
    };

    // Fold small groups into adjacent categories at display time
    const GROUP_REMAP = {
      'Information': 'Professional & Technical Services'
    };

    // --- Map setup ---
    const DEFAULT_VIEW = { center: [38.5, -96], zoom: 4 };
    const DEFAULT_YEAR = 2024;

    const map = L.map('map', { zoomSnap: 0.5 }).setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }
    ).addTo(map);

    // --- State ---
    const CACHE        = {};
    const groupVisible = {};
    GROUP_ORDER.forEach(g => groupVisible[g] = true);

    let groupLayers = {};  // group -> LayerGroup currently on map

    const MARKER_BASE = {
      radius:      4,
      weight:      1,
      color:       '#ffffff',
      fillOpacity: 0.82
    };

    // --- Build legend ---
    (function buildLegend() {
      const container = document.getElementById('legend-items');
      GROUP_ORDER.forEach(g => {
        const row = document.createElement('div');
        row.className = 'legend-row';
        row.id = 'row-' + safeId(g);

        const cb = document.createElement('input');
        cb.type    = 'checkbox';
        cb.checked = true;
        cb.addEventListener('change', function () {
          groupVisible[g] = this.checked;
          row.classList.toggle('dimmed', !this.checked);
          if (this.checked) {
            if (groupLayers[g]) groupLayers[g].addTo(map);
          } else {
            if (groupLayers[g]) map.removeLayer(groupLayers[g]);
          }
          updateTopStats();
        });

        const dot = document.createElement('span');
        dot.className = 'legend-dot';
        dot.style.background = GROUP_COLORS[g] || '#aaa';

        const name = document.createElement('span');
        name.className   = 'legend-name';
        name.textContent = g;

        const count = document.createElement('span');
        count.className = 'legend-count';
        count.id        = 'count-' + safeId(g);
        count.textContent = '—';

        row.appendChild(cb);
        row.appendChild(dot);
        row.appendChild(name);
        row.appendChild(count);
        container.appendChild(row);
      });
    })();

    // --- Render a year's data ---
    function renderYear(data) {
      // Remove all existing group layers
      Object.values(groupLayers).forEach(lg => map.removeLayer(lg));
      groupLayers = {};

      // Group points by industry
      const byGroup = {};
      GROUP_ORDER.forEach(g => byGroup[g] = []);

      data.points.forEach(p => {
        const raw = GROUP_REMAP[p.g] || p.g;
        const g   = (raw && GROUP_COLORS[raw]) ? raw : 'Other';
        byGroup[g].push(p);
      });

      // Build and add a LayerGroup per industry
      GROUP_ORDER.forEach(g => {
        const color   = GROUP_COLORS[g] || '#aaa';
        const markers = byGroup[g].map(p => {
          const yearStr = (p.yr1 === p.yr2)
            ? String(p.yr1)
            : p.yr1 + '–' + p.yr2;

          return L.circleMarker([p.lat, p.lng],
            Object.assign({}, MARKER_BASE, { fillColor: color })
          ).bindPopup(
            '<b>' + nameLink(p.n, p.w) + '</b>' +
            (p.c && p.s
              ? '<span class="popup-meta">' + escHtml(p.c) + ', ' + escHtml(p.s) + '</span><br>'
              : '') +
            '<span class="popup-meta">In dataset: ' + yearStr + '</span><br>' +
            '<span class="popup-meta">Industry: ' + escHtml(g) + '</span>',
            { maxWidth: 280 }
          );
        });

        groupLayers[g] = L.layerGroup(markers);
        if (groupVisible[g]) groupLayers[g].addTo(map);

        // Update legend count
        const el = document.getElementById('count-' + safeId(g));
        if (el) el.textContent = markers.length.toLocaleString();
      });

      updateTopStats(data);
      document.getElementById('loading').style.display = 'none';
    }

    function updateTopStats(data) {
      // Recount only visible (checked) groups from current layers
      let shown = 0;
      GROUP_ORDER.forEach(g => {
        if (groupVisible[g] && groupLayers[g]) {
          shown += groupLayers[g].getLayers().length;
        }
      });
      if (data) {
        document.getElementById('stat-visible').textContent = shown.toLocaleString();
        document.getElementById('stat-na').textContent      = data.no_loc.toLocaleString();
        document.getElementById('stat-total').textContent   = data.total.toLocaleString();
      } else {
        document.getElementById('stat-visible').textContent = shown.toLocaleString();
      }
    }

    // --- Utilities ---
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escAttr(str) {
      return escHtml(str).replace(/"/g, '&quot;');
    }

    // Renders the plan/company name as a link to its website when one is
    // known and safe (http/https only), else falls back to plain bold text.
    function nameLink(name, website) {
      const label = name ? escHtml(name) : '<em>Name not available</em>';
      if (website && /^https?:\/\//i.test(website)) {
        return '<a href="' + escAttr(website) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
      }
      return label;
    }

    function safeId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    // --- Load a year (cache after first load) ---
    const CACHE_DATA = {};
    let   currentData = null;

    function loadYear(year) {
      document.getElementById('year-label').textContent = year;
      document.getElementById('loading').style.display  = 'inline';

      if (CACHE_DATA[year]) {
        currentData = CACHE_DATA[year];
        renderYear(currentData);
        return;
      }

      const script  = document.createElement('script');
      script.src    = 'data/esop_' + year + '.js';
      script.onload = function () {
        CACHE_DATA[year] = window.ESOP_CURRENT;
        currentData      = CACHE_DATA[year];
        renderYear(currentData);
      };
      script.onerror = function () {
        document.getElementById('loading').textContent = 'Error loading ' + year;
      };
      document.head.appendChild(script);
    }

    // --- Slider ---
    const slider = document.getElementById('year-slider');
    let   debounceTimer = null;

    slider.addEventListener('input', function () {
      document.getElementById('year-label').textContent = this.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => loadYear(parseInt(this.value)), 150);
    });

    loadYear(DEFAULT_YEAR);

    // --- Legend show/hide ---
    const legendEl        = document.getElementById('legend');
    const legendCloseBtn   = document.getElementById('legend-close');
    const legendReopenBtn  = document.getElementById('legend-reopen');

    legendCloseBtn.addEventListener('click', function () {
      legendEl.classList.add('closed');
      legendReopenBtn.classList.add('visible');
    });

    legendReopenBtn.addEventListener('click', function () {
      legendEl.classList.remove('closed');
      legendReopenBtn.classList.remove('visible');
    });

    // --- Company search (all years) ---
    let searchIndex = [];
    let searchMatches = [];
    let searchActiveIdx = -1;
    let searchMarker = null;

    (function loadSearchIndex() {
      const script = document.createElement('script');
      script.src = 'data/esop_search_index.js';
      script.onload = function () {
        searchIndex = window.ESOP_SEARCH_INDEX || [];
      };
      document.head.appendChild(script);
    })();

    const searchInput   = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchClearBtn = document.getElementById('search-clear');

    function resetMap() {
      searchInput.value = '';
      closeSearchResults();
      searchClearBtn.classList.remove('visible');

      if (searchMarker) {
        map.removeLayer(searchMarker);
        searchMarker = null;
      }

      slider.value = DEFAULT_YEAR;
      document.getElementById('year-label').textContent = DEFAULT_YEAR;
      loadYear(DEFAULT_YEAR);

      map.setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);
    }

    searchClearBtn.addEventListener('click', resetMap);

    function closeSearchResults() {
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      searchMatches = [];
      searchActiveIdx = -1;
    }

    function renderSearchResults(matches, query) {
      searchResults.innerHTML = '';

      if (!query) {
        closeSearchResults();
        return;
      }

      if (matches.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'search-empty';
        empty.textContent = 'No matching ESOPs found';
        searchResults.appendChild(empty);
        searchResults.classList.add('open');
        return;
      }

      matches.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'search-result' + (p.has_loc ? '' : ' no-loc');
        row.dataset.idx = i;

        const name = document.createElement('span');
        name.className = 'r-name';
        name.textContent = p.n;

        const meta = document.createElement('span');
        meta.className = 'r-meta';
        const loc = (p.c && p.s) ? (p.c + ', ' + p.s + ' — ') : '';
        meta.textContent = p.has_loc
          ? (loc + 'first on record: ' + p.yr1)
          : 'no location data — can’t show on map';

        row.appendChild(name);
        row.appendChild(meta);
        if (p.has_loc) {
          row.addEventListener('click', () => selectSearchResult(p));
        }
        searchResults.appendChild(row);
      });

      searchResults.classList.add('open');
    }

    function selectSearchResult(p) {
      if (!p.has_loc) return;

      searchInput.value = p.n;
      closeSearchResults();
      searchClearBtn.classList.add('visible');

      const zoomLevel = Math.max(map.getZoom(), 9);

      function focusMarker() {
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.circleMarker([p.lat, p.lng], {
          radius: 9,
          weight: 3,
          color: '#222',
          fillColor: '#ffde59',
          fillOpacity: 0.9
        }).addTo(map);
        searchMarker.bindPopup(
          '<b>' + nameLink(p.n, p.w) + '</b>' +
          (p.c && p.s ? '<span class="popup-meta">' + escHtml(p.c) + ', ' + escHtml(p.s) + '</span><br>' : '') +
          '<span class="popup-meta">First on record: ' + p.yr1 + '</span>',
          { maxWidth: 280 }
        ).openPopup();
      }

      map.setView([p.lat, p.lng], zoomLevel);

      if (parseInt(slider.value) !== p.yr1) {
        slider.value = p.yr1;
        document.getElementById('year-label').textContent = p.yr1;
        loadYear(p.yr1);
      }

      // Give the map a moment to settle/render the year before dropping the pin
      setTimeout(focusMarker, 200);
    }

    searchInput.addEventListener('input', function () {
      const query = this.value.trim().toUpperCase();
      searchClearBtn.classList.toggle('visible', query.length > 0);
      if (!query) {
        closeSearchResults();
        return;
      }
      searchMatches = searchIndex
        .filter(p => p.n.toUpperCase().includes(query))
        .slice(0, 25);
      searchActiveIdx = -1;
      renderSearchResults(searchMatches, query);
    });

    searchInput.addEventListener('keydown', function (e) {
      const rows = searchResults.querySelectorAll('.search-result');
      if (!rows.length) return;

      function nextEnabledIdx(start, dir) {
        let i = start;
        while (i >= 0 && i < searchMatches.length) {
          if (searchMatches[i] && searchMatches[i].has_loc) return i;
          i += dir;
        }
        return start;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        searchActiveIdx = nextEnabledIdx(Math.min(searchActiveIdx + 1, rows.length - 1), 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        searchActiveIdx = nextEnabledIdx(Math.max(searchActiveIdx - 1, 0), -1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (searchActiveIdx >= 0 && searchMatches[searchActiveIdx]) {
          selectSearchResult(searchMatches[searchActiveIdx]);
        }
        return;
      } else if (e.key === 'Escape') {
        closeSearchResults();
        return;
      } else {
        return;
      }

      rows.forEach((r, i) => r.classList.toggle('active', i === searchActiveIdx));
      rows[searchActiveIdx].scrollIntoView({ block: 'nearest' });
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#search-wrap')) closeSearchResults();
    });

    // --- Form 5500 PDF viewer ---
    const FORM5500_PDF_URL = 'form5500_example.pdf';

    const pdfModal  = document.getElementById('pdf-modal');
    const pdfFrame  = document.getElementById('pdf-modal-frame');
    const pdfNewTab = document.getElementById('pdf-modal-newtab');

    function openPdfModal() {
      pdfFrame.src   = FORM5500_PDF_URL;
      pdfNewTab.href = FORM5500_PDF_URL;
      pdfModal.classList.add('open');
    }

    function closePdfModal() {
      pdfModal.classList.remove('open');
      pdfFrame.src = ''; // stop loading, free memory
    }

    document.getElementById('form5500-btn').addEventListener('click', openPdfModal);
    document.getElementById('pdf-modal-close').addEventListener('click', closePdfModal);
    pdfModal.addEventListener('click', function (e) {
      if (e.target === pdfModal) closePdfModal(); // click backdrop to close
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closePdfModal();
    });
  </script>

</body>
</html>
